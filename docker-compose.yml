services:
  db:
    image: postgres:16-alpine
    container_name: cph_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cph
      POSTGRES_USER: cph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cph}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cph -d cph"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: